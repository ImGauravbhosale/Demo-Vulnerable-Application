name: MalwHunter dependency scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run MalwHunter
        uses: ImGauravbhosale/Malwhunter@v0.1.0
        with:
          # The demo's "infected" dependency is a Recon-only fixture
          # (no corroborating Detonation signal), so it resolves to
          # `suspicious`, not `malicious` — fail-on has to be lowered
          # to actually catch it. Real projects can leave this at the
          # default (malicious) once they trust their dependency tree.
          fail-on: suspicious
          format: markdown
